<!-- 밝은 카드뉴스 톤 릴스 장면 템플릿. scene.html(다크)과 같은 layout 분기, 번호 배지·아이콘만 추가 -->
<!doctype html>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px;
    height: 1920px;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #eefdf8;
    color: #0f2a43;
    overflow: hidden;
  }

  /* 민트 → 하늘색 라이트 그라데이션. 다크 테마의 radial 구성을 밝은 톤으로 대응 */
  .bg {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(900px 900px at 50% 10%, rgba(45, 212, 191, .28), transparent 60%),
      radial-gradient(700px 700px at 85% 90%, rgba(96, 165, 250, .22), transparent 62%),
      linear-gradient(160deg, #eafff8 0%, #e6f2ff 100%);
  }

  .stage {
    position: absolute;
    inset: 220px 72px 320px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 40px;
  }

  .daybadge {
    position: absolute;
    top: 168px;
    left: 72px;
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #0d9488;
    opacity: .85;
  }

  /* 카드 컨테이너 — point/code/cta 레이아웃에서 사용 */
  .card {
    background: #ffffff;
    border-radius: 44px;
    box-shadow: 0 24px 60px rgba(15, 42, 67, .12);
    padding: 72px 64px;
  }

  /* 번호 배지 — 참고 이미지의 "01" "02" 사각 배지 */
  .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 120px;
    height: 120px;
    border-radius: 28px;
    background: #14213d;
    color: #ffffff;
    font-size: 56px;
    font-weight: 800;
    margin-bottom: 40px;
  }
  .num.empty { display: none; }

  /* 아이콘 원 — 민트 배경 + 선형 SVG */
  .icon {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: #b9f5e6;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 40px;
  }
  .icon svg { width: 72px; height: 72px; stroke: #0d9488; }
  .icon.empty { display: none; }

  .title {
    font-size: 84px;
    font-weight: 800;
    line-height: 1.28;
    letter-spacing: -1.5px;
    color: #0f2a43;
    word-break: keep-all;
  }

  .sub {
    font-size: 56px;
    font-weight: 500;
    line-height: 1.4;
    color: #64748b;
    word-break: keep-all;
    margin-top: 16px;
  }

  /* hook — 첫 3초. 카드 없이 배경 위에 큼직하게 */
  .hook .card { background: none; box-shadow: none; padding: 0; }
  .hook .stage { align-items: flex-start; }
  .hook .title { font-size: 104px; line-height: 1.22; color: #0f2a43; }
  .hook .sub { font-size: 80px; font-weight: 800; color: #0d9488; margin-top: 24px; }

  /* point — 카드 안에 번호/아이콘 + 제목 + 설명 */
  .point .stage { justify-content: center; }

  /* code — 모노스페이스, 민트 보더 */
  .code .card { background: #f0fdfa; border: 3px solid #99f6e4; }
  .code .title {
    font-family: Consolas, "D2Coding", monospace;
    font-size: 44px;
    font-weight: 700;
    line-height: 1.5;
    color: #0f766e;
    word-break: break-all;
  }
  .code .sub { font-size: 52px; color: #475569; }

  /* compare — 밝은 배경에서도 읽히도록 진한 텍스트색 사용 */
  .compare .title {
    font-size: 72px;
    font-weight: 700;
    color: #dc2626;
    background: rgba(239, 68, 68, .08);
    border-left: 10px solid #ef4444;
    border-radius: 0 24px 24px 0;
    padding: 44px 44px;
  }
  .compare .sub {
    font-size: 72px;
    font-weight: 700;
    color: #16a34a;
    background: rgba(34, 197, 94, .08);
    border-left: 10px solid #22c55e;
    border-radius: 0 24px 24px 0;
    padding: 44px 44px;
    margin-top: 32px;
  }

  /* cta — 마지막 컷. 카드 + 알약 버튼 */
  .cta .stage { align-items: center; text-align: center; }
  .cta .title { font-size: 92px; color: #0f2a43; }
  .cta .sub {
    font-size: 58px;
    font-weight: 800;
    color: #ffffff;
    background: #14213d;
    border-radius: 999px;
    padding: 28px 56px;
    margin-top: 40px;
  }

  .empty { display: none; }
</style>

<body class="{{layout}}">
  <div class="bg"></div>
  <div class="daybadge">{{badge}}</div>
  <div class="stage">
    <div class="card {{card_empty}}">
      <div class="num {{num_empty}}">{{num}}</div>
      <div class="icon {{icon_empty}}">{{icon}}</div>
      <div class="title {{title_empty}}">{{title}}</div>
      <div class="sub {{sub_empty}}">{{sub}}</div>
    </div>
  </div>
</body>
