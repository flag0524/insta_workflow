name: 인스타 엑셀 30일 자동 게시

# KST 20:00 target + same-evening retries. Next-day 07:15 recovery.
# GitHub cron may run late; exact punctual publication is not guaranteed.
on:
  schedule:
    - cron: "0,20,40 11 * * *"
    - cron: "15 22 * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "새 계획 DAY 1~30 (비우면 예정분 선택)"
        required: false
      dry_run:
        description: "미리보기만 생성하고 게시·호스팅 업로드하지 않음"
        type: boolean
        required: false
        default: true

concurrency:
  group: daily-post
  cancel-in-progress: false
permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: ffmpeg·한국어 글꼴 준비 (최대 4분)
        timeout-minutes: 4
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            timeout 90s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 update
            timeout 120s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 install -y ffmpeg fonts-noto-cjk
          fi
          ffmpeg -version
      - name: Python 의존성 설치
        timeout-minutes: 3
        run: pip install --disable-pip-version-check --timeout 30 -r requirements.txt
      - name: 실제 시연 자료 확인·안전 압축 해제
        run: python unpack_verified.py
      - name: 계획·일정·검증 게이트 테스트
        run: |
          python plan_publish.py --validate-only
          python plan_publish.py --readiness
          python -m unittest discover -s . -p test_plan_publish.py -v
          python -m unittest discover -s . -p test_verified_media.py -v
      - name: Chromium 설치
        timeout-minutes: 4
        run: playwright install --with-deps chromium
      - name: 계정 확인 및 해당 형식 한 편 실행
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          INPUT_DAY: ${{ github.event.inputs.day }}
          INPUT_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ -n "$INPUT_DAY" ]; then ARGS+=(--day "$INPUT_DAY"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi
          python plan_publish.py "${ARGS[@]}"
      - name: 미리보기·렌더 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instagram-preview-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 7
      - name: 게시·보류 이력 보존
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: 엑셀 계획 게시·보류 이력 갱신"
            git push
          fi
